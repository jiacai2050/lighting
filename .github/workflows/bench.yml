name: Benchmark

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install System Prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk

      - name: Install System Prerequisites (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install wrk

      - name: Setup Zig
        uses: mlugg/setup-zig@v2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Benchmark Suite
        run: |
          python3 bench/run.py

      - name: Attach Job Summary
        if: always()
        run: |
          if [ -f .scratch/latest.md ]; then
            cat .scratch/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi
