<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lighting Todo Demo</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8fafc;
      --card: #ffffff;
      --card-hover: #f1f5f9;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --primary-fg: #ffffff;
      --border: #e2e8f0;
      --input-bg: #f8fafc;
      --item-bg: #f8fafc;
      --item-hover-border: #cbd5e1;
      --badge-bg: #f1f5f9;
      --badge-color: #0284c7;
      --filter-active-bg: #e2e8f0;
      --filter-active-color: #0284c7;
      --delete-hover-bg: rgba(239, 68, 68, 0.1);
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #16a34a;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #0f172a;
        --card: #1e293b;
        --card-hover: #26354a;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --primary: #38bdf8;
        --primary-hover: #0ea5e9;
        --primary-fg: #0f172a;
        --border: #334155;
        --input-bg: #0f172a;
        --item-bg: #0f172a;
        --item-hover-border: #475569;
        --badge-bg: #334155;
        --badge-color: #38bdf8;
        --filter-active-bg: #334155;
        --filter-active-color: #38bdf8;
        --delete-hover-bg: rgba(239, 68, 68, 0.15);
        --danger: #ef4444;
        --danger-hover: #dc2626;
        --success: #10b981;
        --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      }
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0f172a;
      --card: #1e293b;
      --card-hover: #26354a;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --primary-fg: #0f172a;
      --border: #334155;
      --input-bg: #0f172a;
      --item-bg: #0f172a;
      --item-hover-border: #475569;
      --badge-bg: #334155;
      --badge-color: #38bdf8;
      --filter-active-bg: #334155;
      --filter-active-color: #38bdf8;
      --delete-hover-bg: rgba(239, 68, 68, 0.15);
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f8fafc;
      --card: #ffffff;
      --card-hover: #f1f5f9;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --primary-fg: #ffffff;
      --border: #e2e8f0;
      --input-bg: #f8fafc;
      --item-bg: #f8fafc;
      --item-hover-border: #cbd5e1;
      --badge-bg: #f1f5f9;
      --badge-color: #0284c7;
      --filter-active-bg: #e2e8f0;
      --filter-active-color: #0284c7;
      --delete-hover-bg: rgba(239, 68, 68, 0.1);
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #16a34a;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 16px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .app-container {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    header {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    header h1 {
      font-size: 1.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }
    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .theme-toggle-btn {
      background: var(--badge-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .theme-toggle-btn:hover {
      border-color: var(--primary);
    }
    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: var(--shadow);
    }
    .todo-form {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .todo-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .todo-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }
    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background-color: var(--primary);
      color: var(--primary-fg);
    }
    .btn-primary:hover {
      background-color: var(--primary-hover);
    }
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .filters {
      display: flex;
      gap: 6px;
    }
    .filter-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover {
      color: var(--text);
    }
    .filter-btn.active {
      background: var(--filter-active-bg);
      color: var(--filter-active-color);
      border-color: var(--border);
      font-weight: 600;
    }
    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--item-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: all 0.2s;
    }
    .todo-item:hover {
      border-color: var(--item-hover-border);
    }
    .todo-content {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      cursor: pointer;
      overflow: hidden;
    }
    .checkbox {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .todo-item.completed .checkbox {
      background-color: var(--success);
      border-color: var(--success);
    }
    .checkbox::after {
      content: "";
      width: 5px;
      height: 9px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
      display: none;
      margin-bottom: 2px;
    }
    .todo-item.completed .checkbox::after {
      display: block;
    }
    .todo-title {
      font-size: 0.95rem;
      word-break: break-word;
      transition: all 0.2s;
    }
    .todo-item.completed .todo-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }
    .btn-delete {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .btn-delete:hover {
      color: var(--danger);
      background: var(--delete-hover-bg);
    }
    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 32px 0;
      font-size: 0.9rem;
    }
    .footer-stats {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.85rem;
      flex-wrap: wrap;
      gap: 6px;
    }
    .badge {
      background: var(--badge-bg);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 10px;
      color: var(--badge-color);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <div class="header-bar">
        <h1>⚡️ Lighting Todo</h1>
        <button id="theme-btn" class="theme-toggle-btn" onclick="cycleTheme()" title="Toggle Color Theme">🌓 Auto</button>
      </div>
      <p>Zig 0.17 HTTP Server + SQLite Single Page App</p>
    </header>

    <div class="card">
      <form class="todo-form" id="todo-form">
        <input
          type="text"
          id="todo-input"
          class="todo-input"
          placeholder="What needs to be done?"
          autocomplete="off"
          required
        />
        <button type="submit" class="btn btn-primary">Add</button>
      </form>

      <div class="filter-bar">
        <span id="items-left" class="badge">0 items</span>
        <div class="filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="completed">Done</button>
        </div>
      </div>

      <ul class="todo-list" id="todo-list">
        <li class="empty-state">Loading todos...</li>
      </ul>

      <div class="footer-stats">
        <span>Backend: SQLite (:memory: or disk)</span>
        <span>Runtime: Zig 0.17</span>
      </div>
    </div>
  </div>

  <script>
    const THEME_KEY = 'lighting_todo_theme';
    const themeBtn = document.getElementById('theme-btn');

    function applyTheme(theme) {
      const root = document.documentElement;
      if (theme === 'dark') {
        root.setAttribute('data-theme', 'dark');
        themeBtn.innerText = '🌙 Dark';
      } else if (theme === 'light') {
        root.setAttribute('data-theme', 'light');
        themeBtn.innerText = '☀️ Light';
      } else {
        root.removeAttribute('data-theme');
        themeBtn.innerText = '🌓 Auto';
      }
    }

    function cycleTheme() {
      const current = localStorage.getItem(THEME_KEY) || 'auto';
      const next = current === 'auto' ? 'dark' : (current === 'dark' ? 'light' : 'auto');
      if (next === 'auto') {
        localStorage.removeItem(THEME_KEY);
      } else {
        localStorage.setItem(THEME_KEY, next);
      }
      applyTheme(next);
    }

    // Initialize theme preference from localStorage
    applyTheme(localStorage.getItem(THEME_KEY) || 'auto');

    let todos = [];
    let currentFilter = 'all';

    const todoList = document.getElementById('todo-list');
    const todoForm = document.getElementById('todo-form');
    const todoInput = document.getElementById('todo-input');
    const itemsLeft = document.getElementById('items-left');
    const filterButtons = document.querySelectorAll('.filter-btn');

    async function fetchTodos() {
      try {
        const res = await fetch('/api/todos');
        if (!res.ok) throw new Error('Failed to load todos');
        todos = await res.json();
        render();
      } catch (err) {
        todoList.innerHTML = `<li class="empty-state" style="color: var(--danger)">Error loading todos: ${err.message}</li>`;
      }
    }

    async function addTodo(title) {
      try {
        const res = await fetch('/api/todos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title })
        });
        if (!res.ok) throw new Error('Failed to create todo');
        const created = await res.json();
        todos.push(created);
        render();
      } catch (err) {
        alert(err.message);
      }
    }

    async function toggleTodo(id) {
      try {
        const res = await fetch(`/api/todos/${id}/toggle`, { method: 'POST' });
        if (!res.ok) throw new Error('Failed to toggle todo');
        const item = todos.find(t => t.id === id);
        if (item) item.completed = !item.completed;
        render();
      } catch (err) {
        alert(err.message);
      }
    }

    async function deleteTodo(id) {
      try {
        const res = await fetch(`/api/todos/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('Failed to delete todo');
        todos = todos.filter(t => t.id !== id);
        render();
      } catch (err) {
        alert(err.message);
      }
    }

    function render() {
      const filtered = todos.filter(t => {
        if (currentFilter === 'active') return !t.completed;
        if (currentFilter === 'completed') return t.completed;
        return true;
      });

      const activeCount = todos.filter(t => !t.completed).length;
      itemsLeft.textContent = `${activeCount} item${activeCount === 1 ? '' : 's'} left`;

      if (filtered.length === 0) {
        todoList.innerHTML = `<li class="empty-state">No todos in this list.</li>`;
        return;
      }

      todoList.innerHTML = filtered.map(t => `
        <li class="todo-item ${t.completed ? 'completed' : ''}" data-id="${t.id}">
          <div class="todo-content" onclick="toggleTodo(${t.id})">
            <div class="checkbox"></div>
            <span class="todo-title">${escapeHtml(t.title)}</span>
          </div>
          <button class="btn-delete" title="Delete" onclick="deleteTodo(${t.id})">&times;</button>
        </li>
      `).join('');
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g,
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    todoForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = todoInput.value.trim();
      if (!val) return;
      addTodo(val);
      todoInput.value = '';
    });

    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    fetchTodos();
  </script>
</body>
</html>
